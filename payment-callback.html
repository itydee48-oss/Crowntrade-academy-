<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Payment — Crown Trade Academy</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Inter',sans-serif;background:#0F0F10;color:#F0EBE3;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
.box{background:#18181B;border:1px solid rgba(255,255,255,.07);border-radius:20px;padding:44px 40px;max-width:440px;width:100%;text-align:center;}
.icon{font-size:3.5rem;margin-bottom:16px;display:block;}
.icon.success{color:#22C55E;}
.icon.pending{color:#F59E0B;}
.icon.failed{color:#EF4444;}
h1{font-family:'Cormorant Garamond',serif;font-size:2rem;margin-bottom:8px;}
p{color:#9B9589;font-size:.9rem;line-height:1.7;margin-bottom:20px;}
.detail{background:#111115;border:1px solid rgba(255,255,255,.06);border-radius:10px;padding:14px 18px;margin-bottom:20px;text-align:left;}
.detail-row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.04);}
.detail-row:last-child{border-bottom:none;}
.detail-row .lbl{font-size:.72rem;text-transform:uppercase;letter-spacing:.8px;color:#4A4640;}
.detail-row .val{font-weight:700;font-size:.84rem;}
.val.success{color:#22C55E;}
.val.pending{color:#F59E0B;}
.val.failed{color:#EF4444;}
.btn{display:inline-flex;align-items:center;gap:6px;padding:11px 24px;border-radius:9px;cursor:pointer;font-weight:700;font-size:.86rem;border:none;text-decoration:none;transition:all .2s;}
.btn-gold{background:linear-gradient(135deg,#C8A97E,#9A7350);color:#fff;}
.btn-gold:hover{filter:brightness(1.1);}
.btn-ghost{background:rgba(255,255,255,.06);color:#9B9589;margin-top:10px;}
.btn-ghost:hover{background:rgba(255,255,255,.1);}
.spinner{display:inline-block;width:36px;height:36px;border:3px solid rgba(255,255,255,.1);border-top-color:#C8A97E;border-radius:50%;animation:spin .8s linear infinite;margin-bottom:16px;}
@keyframes spin{to{transform:rotate(360deg);}}
</style>
</head>
<body>
<div class="box" id="box">
  <div class="spinner"></div>
  <p style="color:#4A4640;">Verifying your payment...</p>
</div>

<script>
const BASE = 'https://crowntrade-academy-phai.onrender.com/api';

async function checkPayment() {
  const params = new URLSearchParams(window.location.search);
  const trackingId = params.get('OrderTrackingId');
  const ref = params.get('ref'); // callback_ref passed through

  if (!trackingId) {
    showResult('failed', 'No payment reference found.', null);
    return;
  }

  try {
    const token = localStorage.getItem('ct_token');
    const res = await fetch(`${BASE}/payments/callback?OrderTrackingId=${trackingId}&OrderMerchantReference=${params.get('OrderMerchantReference')||''}`, {
      headers: token ? { 'Authorization': 'Bearer ' + token } : {}
    });
    const data = await res.json();

    if (data.paid) {
      showResult('success', data, ref);
    } else if (data.status === 'Pending') {
      showResult('pending', data, ref);
    } else {
      showResult('failed', data, ref);
    }
  } catch(err) {
    showResult('failed', { status: 'Error: ' + err.message }, ref);
  }
}

function showResult(type, data, ref) {
  const icons = { success: 'fa-check-circle', pending: 'fa-clock', failed: 'fa-times-circle' };
  const titles = { success: 'Payment Confirmed!', pending: 'Payment Pending', failed: 'Payment Failed' };
  const messages = {
    success: 'Your payment has been received and verified. Your access has been unlocked automatically.',
    pending: 'Your payment is being processed. This usually takes a few minutes. Your access will unlock automatically once confirmed.',
    failed: 'Your payment could not be completed. No charges have been made. Please try again.'
  };

  const amount = data.amount ? `KES ${parseFloat(data.amount).toLocaleString()}` : '—';
  const method = data.payment_method || '—';
  const status = data.status || '—';

  document.getElementById('box').innerHTML = `
    <i class="fas ${icons[type]} icon ${type}"></i>
    <h1>${titles[type]}</h1>
    <p>${messages[type]}</p>
    <div class="detail">
      <div class="detail-row"><span class="lbl">Amount</span><span class="val">${amount}</span></div>
      <div class="detail-row"><span class="lbl">Method</span><span class="val">${method}</span></div>
      <div class="detail-row"><span class="lbl">Status</span><span class="val ${type}">${status}</span></div>
    </div>
    ${type === 'success' || type === 'pending'
      ? `<a href="client-dashboard.html" class="btn btn-gold"><i class="fas fa-home"></i> Go to Dashboard</a>`
      : `<a href="client-dashboard.html#payments" class="btn btn-gold"><i class="fas fa-redo"></i> Try Again</a>`}
    <br>
    <a href="client-dashboard.html" class="btn btn-ghost"><i class="fas fa-arrow-left"></i> Back to Dashboard</a>`;
}

checkPayment();
</script>
</body>
</html>
